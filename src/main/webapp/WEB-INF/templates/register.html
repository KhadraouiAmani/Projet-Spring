<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Student Portal</title>
    <style>
        /* On reprend exactement le CSS de Belkis pour la cohérence */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        .navbar {
            background: rgba(255, 255, 255, 0.95); padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .navbar-logo { font-size: 1.5rem; font-weight: bold; color: #667eea; text-decoration: none; }
        .navbar-menu { display: flex; gap: 2rem; list-style: none; }
        .navbar-menu a { color: #333; text-decoration: none; font-weight: 500; }

        /* Style du Formulaire */
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; }
        .content {
            background: white; border-radius: 15px; padding: 2.5rem;
            max-width: 500px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .content h1 { color: #667eea; margin-bottom: 1.5rem; text-align: center; }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #444; font-weight: 600; }
        .form-group input {
            width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px;
            font-size: 1rem; transition: border-color 0.3s;
        }
        .form-group input:focus { border-color: #667eea; outline: none; }

        /* Style des erreurs de validation (Ton Exemple 5) */
        .error-msg { color: #e53e3e; font-size: 0.85rem; margin-top: 0.25rem; font-style: italic; }

        .btn-submit {
            width: 100%; padding: 0.8rem; margin-top: 1rem; border: none; border-radius: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    </style>
</head>
<body>
<!-- On garde la même barre de navigation -->
<nav class="navbar">
    <a th:href="@{/hello}" class="navbar-logo">📚 Student Portal</a>
    <ul class="navbar-menu">
        <li><a th:href="@{/hello}" th:text="#{nav.home}">Accueil</a></li>
        <li><a href="#" th:text="#{nav.login}">Connexion</a></li>
    </ul>
</nav>

<div class="container">
    <div class="content">
        <h1 th:text="#{nav.register}">Inscription</h1>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <!-- Champ NOM -->
            <div class="form-group">
                <label>Nom Complet</label>
                <input type="text" th:field="*{nom}" placeholder="Entrez votre nom" />
                <p class="error-msg" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></p>
            </div>

            <!-- Champ EMAIL -->
            <div class="form-group">
                <label>Email Académique</label>
                <input type="text" th:field="*{email}" placeholder="exemple@etudiant.com" />
                <p class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>

            <!-- Champ PASSWORD -->
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" th:field="*{password}" placeholder="Minimum 6 caractères" />
                <p class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>

            <button type="submit" class="btn-submit">Créer mon compte</button>
        </form>

        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: #666; text-align: center;">
            Déjà inscrit ? <a th:href="@{/login}" style="color: #667eea; text-decoration: none; font-weight: bold;">Se connecter</a>
        </p>
    </div>
</div>
</body>
</html>
