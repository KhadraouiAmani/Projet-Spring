<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirmation</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .box { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .btn { display: inline-block; margin-top: 1rem; padding: 0.5rem 1rem; background: #667eea; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
<div class="box">
    <h2 style="color: #2d3748;">✅ Succès !</h2>
    <p th:text="${message}"></p>
    <a th:href="@{/events}" class="btn">Retour aux événements</a>
</div>
</body>
</html>
