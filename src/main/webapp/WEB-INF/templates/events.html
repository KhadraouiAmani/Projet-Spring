<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Événements - Student Portal</title>
    <style>
        /* On reprend le style global */
        body { font-family: sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 2rem; color: white; }
        .card { background: white; color: #333; padding: 1.5rem; border-radius: 10px; margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h1 { text-align: center; margin-bottom: 2rem; }
        .btn-back { color: white; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<a th:href="@{/hello}" class="btn-back">← Retour à l'accueil</a>
<h1>📅 Liste des Événements Étudiants</h1>

<div th:if="${#lists.isEmpty(events)}" style="text-align: center;">
    <p>Aucun événement n'est encore enregistré en base de données.</p>
</div>

<!-- On boucle sur la liste des événements (Ton travail d'Architecte) -->
<div th:each="event : ${events}" class="card">
    <h2 th:text="${event.titre}">Titre de l'événement</h2>
    <p><strong>Lieu :</strong> <span th:text="${event.lieu}">Lieu</span></p>
    <p><strong>Date :</strong> <span th:text="${event.date}">Date</span></p>
    <p th:text="${event.description}">Description de l'événement</p>
</div>
</body>
</html>
