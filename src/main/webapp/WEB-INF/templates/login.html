<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title}">Login</title>
    <style th:replace="~{welcome :: base-style}"></style>
    <style>
        .auth-card {
            max-width: 520px;
            text-align: left;
        }

        .auth-card h1,
        .auth-card > p {
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.45rem;
            color: #4a4a4a;
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #d9def7;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .inline-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            color: #555;
            font-size: 0.95rem;
        }

        .text-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .text-link:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 12px;
            padding: 0.9rem 1rem;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .alert-error {
            background: #fdecec;
            color: #b42318;
        }

        .alert-success {
            background: #ecfdf3;
            color: #027a48;
        }

        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            color: #666;
        }

        @media (max-width: 480px) {
            .inline-row {
                flex-direction: column;
                align-items: stretch;
            }

            .remember-me {
                justify-content: center;
            }
        }
    </style>
</head>
<body th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}">
<nav th:replace="~{welcome :: navbar('/login')}"></nav>

<div class="container">
    <div class="content auth-card">
        <h1 th:text="#{login.title}">Sign In</h1>
        <p th:text="#{welcome.message}">Discover and participate in campus events</p>

        <div class="alert alert-success" th:if="${param.registered}" th:text="#{register.success}">Registration successful!</div>
        <div class="alert alert-error" th:if="${loginError}" th:text="#{login.error}">Invalid email or password</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email" th:text="#{login.email}">Email Address</label>
                <input id="email" class="form-input" type="email" name="email" required autocomplete="email"
                       th:value="${loginEmail}" />
            </div>

            <div class="form-group">
                <label for="password" th:text="#{login.password}">Password</label>
                <input id="password" class="form-input" type="password" name="password" required autocomplete="current-password" />
            </div>

            <div class="inline-row">
                <label class="remember-me" for="rememberMe">
                    <input id="rememberMe" type="checkbox" name="rememberMe" />
                    <span th:text="#{login.rememberme}">Remember me</span>
                </label>
                <a class="text-link" href="#" th:text="#{login.forgotpassword}">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{login.button}">Sign In</button>
        </form>

        <p class="auth-footer">
            <span th:text="#{login.newuser}">Not yet registered?</span>
            <a class="text-link" th:href="@{/register(lang=${#locale.language})}" th:text="#{nav.register}">Register</a>
        </p>
    </div>
</div>

<footer th:replace="~{welcome :: footer}"></footer>
</body>
</html>
